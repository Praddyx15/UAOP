syntax = "proto3";

package uaop.telemetry.v1;

import "google/protobuf/field_mask.proto";
import "uaop/telemetry/v1/vehicle_telemetry.proto";

// The changed-fields-only form for constrained links (TELEMETRY_ENGINE.md §2).
// Carries the same category oneof as VehicleTelemetry so a delta and a full
// snapshot are structurally interchangeable to any consumer; `changed_fields`
// names only the fields inside the populated category message that differ
// from the last value that vehicle/category pair sent. Same schema version
// as VehicleTelemetry — additive-only, never renumbered (ADR-0009).
message TelemetryDelta {
  TelemetryEnvelope envelope = 1;
  google.protobuf.FieldMask changed_fields = 2;

  oneof category {
    Position position = 3;
    Attitude attitude = 4;
    Velocity velocity = 5;
    Imu imu = 6;
    Ekf ekf = 7;
    Battery battery = 8;
    EscTelemetry esc = 9;
    Rc rc = 10;
    Link link = 11;
    Rf rf = 12;
    Health health = 13;
    VehicleState state = 14;
    RemoteId remoteid = 15;
  }
}
