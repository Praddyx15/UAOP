syntax = "proto3";

package uaop.errors.v1;

// The platform error-code registry (API_SPECIFICATION.md §1): services may not
// invent error strings ad hoc, every code a client can see is named here first.
// proto3 JSON mapping renders an enum value as its name, so `ERROR_CODE_FOO`
// is exactly the `error.code` string REST/JSON clients receive — the
// `ERROR_CODE_` prefix is required by buf's ENUM_VALUE_PREFIX lint rule
// (protobuf enum values share their enclosing file's C++ scope), not a
// stylistic choice. Additive-only: new codes append, nothing is renumbered.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // Cross-cutting (mirrors common gRPC status categories client code already
  // has to handle, so nothing new to learn for the generic cases)
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_UNAUTHENTICATED = 6;
  ERROR_CODE_RATE_LIMITED = 7;
  ERROR_CODE_TIMEOUT = 8;
  ERROR_CODE_UNAVAILABLE = 9;

  // Vehicle / command domain (API_SPECIFICATION.md §4)
  ERROR_CODE_VEHICLE_NOT_READY = 100;
  ERROR_CODE_VEHICLE_NOT_FOUND = 101;
  ERROR_CODE_COMMAND_REJECTED = 102;
  ERROR_CODE_COMMAND_TIMEOUT = 103;
  ERROR_CODE_LINK_UNAVAILABLE = 104;

  // Mission / geofence domain
  ERROR_CODE_MISSION_VALIDATION_FAILED = 200;
  ERROR_CODE_MISSION_UPLOAD_FAILED = 201;
  ERROR_CODE_MISSION_NOT_FOUND = 202;
  ERROR_CODE_GEOFENCE_VALIDATION_FAILED = 203;

  // Parameter domain
  ERROR_CODE_PARAMETER_OUT_OF_RANGE = 300;
  ERROR_CODE_PARAMETER_WRITE_FAILED = 301;
  ERROR_CODE_PARAMETER_NOT_FOUND = 302;

  // Telemetry query / export domain
  ERROR_CODE_QUERY_COST_EXCEEDED = 400;
  ERROR_CODE_EXPORT_FAILED = 401;

  // Compliance domain
  ERROR_CODE_CHECKLIST_NOT_SIGNED = 500;
  ERROR_CODE_AUTHORISATION_DENIED = 501;
}

// The single error envelope every surface uses (API_SPECIFICATION.md §1).
message Error {
  ErrorCode code = 1;
  string message = 2;
  string correlation_id = 3;
  map<string, string> details = 4;
}
