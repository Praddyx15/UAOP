# PR pipeline (CI_CD.md §1) — gates fail closed. Stages grow with milestones;
# every stage listed here is real and green from M0 onward.
name: pr

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guards:
    name: guards (frozen dirs, doc links, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python tools/ci/check_frozen_dirs.py
      - run: python tools/ci/check_doc_links.py
      - run: python tools/ci/check_licenses.py
      - run: python compliance/tools/rtm-generator/rtm_gen.py --check

  build-linux:
    name: build+test linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  build-linux-arm64:
    name: build+test linux arm64 (UAOP-NFR-007)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  build-gcs-linux:
    name: build+test GCS (linux, Qt 6.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install aqtinstall==3.3.0
      # qtshadertools is a separate addon module (confirmed via `aqt list-qt --modules`)
      # that Qt6's Quick CMake package config depends on even for plain QML/Quick apps
      # with no custom shader work — omitting it fails find_package(Qt6 ... Quick).
      - run: aqt install-qt linux desktop 6.11.1 linux_gcc_64 -m qtshadertools -O ${{ github.workspace }}/qt-install
      - name: Locate installed Qt kit directory
        # aqt's on-disk directory name does not always match the arch argument passed
        # to install-qt (e.g. "linux_gcc_64" installs to a "gcc_64" directory) — detect
        # it rather than hardcode aqt's internal naming, which has changed before.
        run: |
          QT_DIR=$(find "${{ github.workspace }}/qt-install/6.11.1" -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "Detected Qt kit directory: $QT_DIR"
          test -d "$QT_DIR/lib/cmake/Qt6" || { echo "::error::no Qt6 CMake config found under $QT_DIR"; exit 1; }
          echo "QT_CMAKE_PREFIX=$QT_DIR" >> "$GITHUB_ENV"
      - name: Qt runtime + build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3
      - run: cmake --preset gcs-debug -DCMAKE_PREFIX_PATH=${{ env.QT_CMAKE_PREFIX }}
      - run: cmake --build --preset gcs-debug
      - run: ctest --preset gcs-debug --output-on-failure

  security-scan:
    name: trivy fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
