syntax = "proto3";

package uaop.gateway.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// MissionService — API_SPECIFICATION.md §3 mission/geofence resource map.
// Mission and geofence plan content (waypoints, actions, polygons) is carried
// as google.protobuf.Struct rather than a typed schema here: the typed domain
// model belongs to mission-engine's own contract (MISSION_ENGINE.md), landing
// when that engine is built (M2+) — freezing it prematurely at the gateway
// layer would let the gateway surface outrun the engine that actually owns
// mission semantics.
service MissionService {
  rpc CreateMission(CreateMissionRequest) returns (CreateMissionResponse);
  rpc GetMission(GetMissionRequest) returns (GetMissionResponse);
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);
  rpc UploadMission(UploadMissionRequest) returns (UploadMissionResponse); // 202 + correlation_id
  rpc VerifyMission(VerifyMissionRequest) returns (VerifyMissionResponse); // round-trip check state

  rpc CreateGeofence(CreateGeofenceRequest) returns (CreateGeofenceResponse);
  rpc ListGeofences(ListGeofencesRequest) returns (ListGeofencesResponse);
  rpc UploadGeofence(UploadGeofenceRequest) returns (UploadGeofenceResponse);
}

message Mission {
  string mission_id = 1;
  string name = 2;
  google.protobuf.Struct plan = 3; // waypoints/speeds/actions/DO_LAND_START/RTL
  string plan_hash = 4;            // TELEMETRY_ENGINE.md-adjacent identity discipline (HLR-012)
  google.protobuf.Timestamp created_at = 5;
}

message CreateMissionRequest {
  string name = 1;
  google.protobuf.Struct plan = 2;
}

message CreateMissionResponse {
  Mission mission = 1;
}

message GetMissionRequest {
  string mission_id = 1;
}

message GetMissionResponse {
  Mission mission = 1;
}

message ListMissionsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListMissionsResponse {
  repeated Mission missions = 1;
  string next_page_token = 2;
}

message UploadMissionRequest {
  string mission_id = 1;
  string vehicle_id = 2;
}

message UploadMissionResponse {
  string correlation_id = 1;
}

message VerifyMissionRequest {
  string mission_id = 1;
  string vehicle_id = 2;
}

enum VerifyState {
  VERIFY_STATE_UNSPECIFIED = 0;
  VERIFY_STATE_MATCH = 1;
  VERIFY_STATE_MISMATCH = 2;
  VERIFY_STATE_INCOMPLETE = 3;
}

message VerifyMissionResponse {
  VerifyState state = 1;
  string detail = 2;
}

message Geofence {
  string geofence_id = 1;
  string name = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_INCLUSION = 1;
    KIND_EXCLUSION = 2;
  }
  Kind kind = 3;

  enum BreachAction {
    BREACH_ACTION_UNSPECIFIED = 0;
    BREACH_ACTION_RTL = 1;
    BREACH_ACTION_LAND = 2;
    BREACH_ACTION_LOITER = 3;
    BREACH_ACTION_HOLD = 4;
    BREACH_ACTION_REPORT = 5;
  }
  BreachAction breach_action = 4;

  google.protobuf.Struct geometry = 5; // polygon or circle definition
}

message CreateGeofenceRequest {
  string name = 1;
  Geofence.Kind kind = 2;
  Geofence.BreachAction breach_action = 3;
  google.protobuf.Struct geometry = 4;
}

message CreateGeofenceResponse {
  Geofence geofence = 1;
}

message ListGeofencesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListGeofencesResponse {
  repeated Geofence geofences = 1;
  string next_page_token = 2;
}

message UploadGeofenceRequest {
  string geofence_id = 1;
  string vehicle_id = 2;
}

message UploadGeofenceResponse {
  string correlation_id = 1;
}
