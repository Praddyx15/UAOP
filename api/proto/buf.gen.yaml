version: v2
managed:
  enabled: true
plugins:
  # C++ message codegen for the microservices (Drogon) and the Qt GCS (C++20).
  # gRPC service stubs join this list once api/proto/uaop/gateway/v1 lands (M1.3);
  # telemetry v1 defines messages only, no services.
  - protoc_builtin: cpp
    out: gen/cpp
  # Python message codegen for the AI/sim engines (FastAPI, Phase 2+).
  - protoc_builtin: python
    out: gen/python
